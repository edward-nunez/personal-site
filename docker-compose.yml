services:
  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: personal-site-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: personal_site
    ports:
      - "5432:5432"
    # PG 18+ expects mount at /var/lib/postgresql (data in versioned subdir)
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - personal-site-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d personal_site"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express.js Backend API
  backend:
    build:
      context: .
      dockerfile: ./packages/backend/Dockerfile
    container_name: personal-site-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://admin:admin123@postgres:5432/personal_site?schema=public
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: dev-secret-change-in-production
      JWT_EXPIRES_IN: 7d
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./packages/backend/src:/app/src
    networks:
      - personal-site-network

  # AI Agent Service (uses Ollama for LLM)
  agent:
    build:
      context: .
      dockerfile: ./packages/agent/Dockerfile
    container_name: personal-site-agent
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      CORS_ORIGIN: "http://localhost:5173,http://localhost:3000"
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: neural-chat
    depends_on:
      - backend
    volumes:
      - ./packages/agent/src:/app/src
    networks:
      - personal-site-network

  # HAProxy Web Server (serves frontend SPA)
  # HAProxy 3.3.3 - powerful reverse proxy with security features and load balancing
  frontend:
    build:
      context: .
      dockerfile: ./packages/frontend/Dockerfile
    container_name: personal-site-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    depends_on:
      - backend
    volumes:
      - ./packages/frontend/src:/app/src
    networks:
      - personal-site-network

  # Optional: Ollama service for AI capabilities
  # Uncomment to enable local LLM support for the agent service
  ollama:
    image: ollama/ollama:latest
    container_name: personal-site-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - personal-site-network

volumes:
  postgres_data:
  ollama_data:

networks:
  personal-site-network:
    driver: bridge
