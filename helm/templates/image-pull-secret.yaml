{{- range .Values.imagePullSecrets.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  labels:
    {{- include "personal-site.labels" $ | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ include "personal-site.dockerconfigjson" . | b64enc }}
{{- end }}
