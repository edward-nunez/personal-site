{{- if .Values.ingress.enabled }}
{{- if eq .Values.ingress.className "traefik" }}
---
# Redirect HTTP to HTTPS
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "personal-site.fullname" . }}-redirect-https
  labels:
    {{- include "personal-site.labels" . | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# Security Headers
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "personal-site.fullname" . }}-security-headers
  labels:
    {{- include "personal-site.labels" . | nindent 4 }}
spec:
  headers:
    customResponseHeaders:
      X-Frame-Options: "DENY"
      X-Content-Type-Options: "nosniff"
      X-XSS-Protection: "1; mode=block"
      Referrer-Policy: "strict-origin-when-cross-origin"
      Permissions-Policy: "geolocation=(), microphone=(), camera=()"
    sslRedirect: true
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    contentTypeNosniff: true
    browserXssFilter: true
    frameDeny: true
---
# Rate Limiting
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "personal-site.fullname" . }}-rate-limit
  labels:
    {{- include "personal-site.labels" . | nindent 4 }}
spec:
  rateLimit:
    average: 100
    burst: 50
    period: 1s
---
# Compression
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "personal-site.fullname" . }}-compress
  labels:
    {{- include "personal-site.labels" . | nindent 4 }}
spec:
  compress:
    excludedContentTypes:
      - text/event-stream
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "personal-site.fullname" . }}-strip-orchestrator
  labels:
    {{- include "personal-site.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - /v1/orchestrator
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "personal-site.fullname" . }}-strip-fit-sync
  labels:
    {{- include "personal-site.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - /v1/fit-sync
{{- end }}
{{- end }}
