apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "personal-site.fullname" . }}-config
  labels:
    {{- include "personal-site.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.backend.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- with .Values.configMap.data }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
