{{- if .Values.backend.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "personal-site.componentServiceAccountName" (dict "component" "backend" "context" $) }}
  labels:
    {{- include "personal-site.componentLabels" (dict "component" "backend" "context" $) | nindent 4 }}
  {{- with .Values.backend.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end -}}
{{- if .Values.frontend.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "personal-site.componentServiceAccountName" (dict "component" "frontend" "context" $) }}
  labels:
    {{- include "personal-site.componentLabels" (dict "component" "frontend" "context" $) | nindent 4 }}
  {{- with .Values.frontend.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end -}}
