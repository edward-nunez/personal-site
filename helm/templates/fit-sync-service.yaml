{{- if .Values.fitSync.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "personal-site.fitSync.serviceName" . }}
  labels:
    {{- include "personal-site.componentLabels" (dict "component" "fit-sync" "context" $) | nindent 4 }}
  {{- with .Values.fitSync.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.fitSync.service.type }}
  ports:
    - port: {{ .Values.fitSync.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "personal-site.componentSelectorLabels" (dict "component" "fit-sync" "context" $) | nindent 4 }}
{{- end }}
