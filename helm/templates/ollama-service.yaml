{{- if .Values.ollama.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "personal-site.ollama.serviceName" . }}
  labels:
    {{- include "personal-site.componentLabels" (dict "component" "ollama" "context" $) | nindent 4 }}
  {{- with .Values.ollama.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.ollama.service.type }}
  ports:
    - port: {{ .Values.ollama.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "personal-site.componentSelectorLabels" (dict "component" "ollama" "context" $) | nindent 4 }}
{{- end }}
