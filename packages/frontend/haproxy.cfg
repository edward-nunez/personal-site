global
  log stdout local0
  log stdout local1 notice

  # Default SSL material locations
  ca-base /etc/ssl/certs
  crt-base /etc/ssl/private

  # Security headers and defaults
  tune.ssl.default-dh-param 2048

defaults
  log     global
  mode    http
  option  httplog
  option  dontlognull
  timeout connect 5000
  timeout client  50000
  timeout server  50000

  # Add security headers
  http-reuse safe
  compression algo gzip
  compression type text/html text/plain text/css text/javascript application/javascript application/json

frontend frontend_http
  bind *:80
  mode http
  option httplog
  
  # Health check endpoint
  acl is_health_check path /health
  use_backend health_check if is_health_check
  
  # Serve static files and SPA
  default_backend static_files
  
  # Add security headers to responses
  http-response set-header X-Content-Type-Options "nosniff"
  http-response set-header X-Frame-Options "DENY"
  http-response set-header Referrer-Policy "strict-origin-when-cross-origin"
  http-response set-header X-XSS-Protection "1; mode=block"
  http-response set-header Permissions-Policy "camera=(), microphone=(), geolocation=()"


backend static_files
  mode http
  balance roundrobin
  
  # Serve from localhost file system via HAProxy's static file serving
  # Note: Using a simple HTTP server backend on loopback
  server static_server 127.0.0.1:8080 check fall 3 rise 2

backend health_check
  mode http
  server static_server 127.0.0.1:8080 check
